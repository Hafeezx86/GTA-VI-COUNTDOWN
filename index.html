<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA VI COUNTDOWN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>GTA VI COUNTDOWN</h1>
  <p>GTA VI LAUNCHES IN
    <time id="main-countdown">00:00:00:00</time></p>

  <h2>Launch time in every time zone</h2>
  <table>
    <thead>
      <tr>
        <th>Time zone</th>
        <th>Local launch</th>
        <th>In your time</th>
        <th>Countdown</th>
      </tr>
    </thead>
    <tbody id="tz-table"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
